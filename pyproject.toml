[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-hook"
version = "0.1.0"
description = "Memory scanner, hook engine and reverse engineering tool for games on Linux (also under Wine/Proton) and Windows"
requires-python = ">=3.11"
dependencies = [
    "frida",
    "capstone",
    "psutil",
    "numpy",
    "PyQt6",
    "sqlalchemy",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hermes = "hermes.main:main"

[tool.setuptools.packages.find]
include = ["hermes*"]

[tool.setuptools.package-data]
"hermes.ui" = ["localization/*.json", "resources/*.svg"]
"hermes.core" = ["*.js", "inject/inject.c", "inject/build.sh"]
"hermes.engines" = ["*.js"]
"hermes.engines.mono" = ["*.js"]
"hermes.features" = ["*.js"]
"hermes.hooks" = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]