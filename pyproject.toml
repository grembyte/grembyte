[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grembyte"
dynamic = ["version"]
description = "Memory scanner, hook engine and reverse engineering tool for games on Linux (also under Wine/Proton) and Windows"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY_NOTICES"]
dependencies = [
    "frida",
    "capstone",
    "psutil",
    "numpy",
    "PySide6-Essentials",
    "sqlalchemy",
]

[project.optional-dependencies]
test = ["pytest"]
docs = ["mkdocs-material", "mkdocs-glightbox"]

[project.scripts]
grembyte = "grembyte.main:main"
grembyte-cli = "grembyte.cli:main"

[tool.setuptools.dynamic]
version = {attr = "grembyte.__version__"}

[tool.setuptools.packages.find]
include = ["grembyte*"]

[tool.setuptools.package-data]
"grembyte.ui" = ["localization/*.json", "resources/*.svg", "resources/icons/*", "themes/*.json"]
"grembyte.attach" = ["inject/inject.c", "inject/build.sh"]
"grembyte.agent" = ["*.js"]
"grembyte.engines" = ["*.js"]
"grembyte.engines.il2cpp" = ["*.js"]
"grembyte.engines.mono" = ["*.js"]
"grembyte.engines.unreal" = ["*.js"]
"grembyte.features" = ["*.js"]
"grembyte.hooks" = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]