[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-hook"
version = "0.1.0"
description = "Linux memory scanner, hook engine and reverse engineering tool"
requires-python = ">=3.11"
dependencies = [
    "frida",
    "capstone",
    "pyelftools",
    "psutil",
    "numpy",
    "rich",
    "PyQt6",
    "sqlalchemy",
    "alembic",
]

[project.scripts]
hermes = "hermes.main:main"

[tool.setuptools.packages.find]
include = ["hermes*"]

[tool.setuptools.package-data]
"hermes.ui" = ["localization/*.json", "resources/*.svg"]
"hermes.core" = ["*.js", "inject/*.exe", "inject/inject.c", "inject/build.sh"]
"hermes.engines" = ["*.js"]
"hermes.engines.mono" = ["*.js"]
"hermes.features" = ["*.js"]
"hermes.hooks" = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]