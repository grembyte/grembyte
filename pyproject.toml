[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-hook"
dynamic = ["version"]
description = "Memory scanner, hook engine and reverse engineering tool for games on Linux (also under Wine/Proton) and Windows"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY_NOTICES"]
dependencies = [
    "frida",
    "capstone",
    "psutil",
    "numpy",
    "PySide6-Essentials",
    "sqlalchemy",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hermes = "hermes.main:main"

[tool.setuptools.dynamic]
version = {attr = "hermes.__version__"}

[tool.setuptools.packages.find]
include = ["hermes*"]

[tool.setuptools.package-data]
"hermes.ui" = ["localization/*.json", "resources/*.svg", "resources/icons/*", "themes/*.json"]
"hermes.core" = ["*.js", "inject/inject.c", "inject/build.sh"]
"hermes.agent" = ["*.js"]
"hermes.engines" = ["*.js"]
"hermes.engines.il2cpp" = ["*.js"]
"hermes.engines.mono" = ["*.js"]
"hermes.engines.unreal" = ["*.js"]
"hermes.features" = ["*.js"]
"hermes.hooks" = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]