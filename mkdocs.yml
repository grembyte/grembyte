site_name: Hermes Hook
site_description: Memory scanner, hook engine and reverse engineering tool for games on Linux (also under Wine/Proton) and Windows
site_author: Frank Hoogen
site_url: https://winterhafen.github.io/hermes-hook/
repo_url: https://github.com/winterhafen/hermes-hook
repo_name: winterhafen/hermes-hook
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Frank Hoogen – MIT License

# Working notes in docs/ that are not part of the site.
exclude_docs: |
  review-*.md
  assets/photos/*.png

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: material/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - social

extra_css:
  - assets/extra.css

plugins:
  - search
  - glightbox:
      skip_classes:
        - no-zoom

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Permissions: getting-started/permissions.md
      - "Tutorial: your first hook": getting-started/first-hook.md
  - User guide:
      - Scanning for values: guide/scanning.md
      - Tracked addresses: guide/addresses.md
      - Pointer scan: guide/pointer-scan.md
      - Write and read watch: guide/write-watch.md
      - Hooks: guide/hooks.md
      - Hook templates: guide/templates.md
      - Scripts: guide/scripts.md
      - Native trace and monitor: guide/native-tools.md
      - Code explorer: guide/code-explorer.md
      - Object browser: guide/object-browser.md
      - Docking, memory, sessions and logs: guide/tools.md
      - Settings and themes: guide/settings.md
      - Saving, export and import: guide/data.md
  - Engines:
      - engines/index.md
      - Unity (Mono): engines/unity-mono.md
      - Unity (IL2CPP): engines/unity-il2cpp.md
      - Unreal Engine: engines/unreal.md
  - Examples:
      - examples/index.md
      - Scans and pointer scan: examples/hermesquest-scans.md
      - Hooks: examples/hermesquest-hooks.md
      - Scripts: examples/hermesquest-scripts.md
      - Code explorer: examples/dummy-game-code-explorer.md
      - Pointer chain from the code: examples/dummy-game-pointer-chain.md
      - JavaScript in Hermes: examples/javascript.md
  - Wine and Proton: wine-proton.md
  - Reference:
      - Files and environment: reference/files.md
      - Hook context (ctx): reference/hook-context.md
      - Script context (ctx): reference/script-context.md
      - Assembly (x86-64): reference/assembly.md
      - Regular expressions: reference/regex.md
  - Development:
      - development/index.md
      - Architecture: development/architecture.md
      - Implementation notes: development/implementation-notes.md
      - Screenshots: development/screenshots.md
