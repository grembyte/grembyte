<!-- Grembyte icon: the bits 0110 0111 (0x67, ASCII "g") as two rows of four squares; filled = 1, outlined = 0 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -14 51 51">
    <g fill="#8cfa5a">
      <rect x="1.25" y="1.25" width="7.5" height="7.5" fill="none" stroke="#8cfa5a" stroke-width="2.5"/>
      <rect x="13" y="0" width="10" height="10"/>
      <rect x="26" y="0" width="10" height="10"/>
      <rect x="40.25" y="1.25" width="7.5" height="7.5" fill="none" stroke="#8cfa5a" stroke-width="2.5"/>
      <rect x="1.25" y="14.25" width="7.5" height="7.5" fill="none" stroke="#8cfa5a" stroke-width="2.5"/>
      <rect x="13" y="13" width="10" height="10"/>
      <rect x="26" y="13" width="10" height="10"/>
      <rect x="39" y="13" width="10" height="10"/>
    </g>
</svg>
